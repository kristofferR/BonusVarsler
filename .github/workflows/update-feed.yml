name: Update Merchant Feeds

on:
  schedule:
    # Run daily at 6am UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd scripts && bun install

      - name: Install Playwright browsers
        run: cd scripts && bunx playwright install chromium --with-deps

      - name: Run scraper
        run: bun scripts/scrape-feeds.ts

      - name: Copy sitelist to root (minified, used by extension CDN)
        run: node -e "const fs=require('fs'); fs.writeFileSync('sitelist.json', JSON.stringify(JSON.parse(fs.readFileSync('data/sitelist.json','utf8'))))"

      - name: Evaluate scraper health
        id: health
        run: bun scripts/check-feed-health.ts

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- data/sitelist.json sitelist.json .feed-health.json)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/sitelist.json sitelist.json .feed-health.json
          git commit -m "chore: update merchant feeds"
          git push

      - name: Alert on repeated scraper failures
        if: steps.health.outputs.has_alerts == 'true'
        run: |
          echo "::error::Repeated scraper failures detected: ${{ steps.health.outputs.alert_services }}"
          exit 1
